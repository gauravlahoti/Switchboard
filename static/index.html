<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reflex Agentic Workflow</title>
<link rel="icon" href="/static/brand/favicon.svg?v=2" type="image/svg+xml" sizes="any">
<link rel="shortcut icon" href="/static/brand/favicon.svg?v=2" type="image/svg+xml">
<meta name="application-name" content="Reflex Agentic Workflow">
<meta name="theme-color" content="#000000">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
})();
</script>
<style>
@font-face { font-family: "Inter"; font-style: normal; font-weight: 200 700; font-display: swap; src: url("/static/brand/inter-var.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/static/brand/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
:root {
  /* gauravlahoti.dev brand, dark first. Jev is the cyan accent, Gemini the brand purple. */
  --bg: #0a0b0c; --elev: #0e0f10; --surface: #131516; --text: #e7e9e8; --muted: #8e9694; --subtle: #5a6260;
  --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.14); --bubble: #1b1d1e;
  --jev: #4fd6bd; --llm: #a99ad9; --det: #94a3af; --sec: #e0766f; --ok: #6fc59a; --hitl: #d8b46c; --warn: #d8b46c;
  --brand: var(--jev); --on-brand: #06201b; --on-k: #0a0b0c;
  --edge: #272a2b; --arrow: #484d4f; --grid: rgba(255,255,255,.04); --blob: .28;
  --jev-s: color-mix(in srgb, var(--jev) 12%, var(--surface));
  --det-s: color-mix(in srgb, var(--det) 12%, var(--surface));
  --llm-s: color-mix(in srgb, var(--llm) 13%, var(--surface));
  --sec-s: color-mix(in srgb, var(--sec) 12%, var(--surface));
  --ok-s: color-mix(in srgb, var(--ok) 12%, var(--surface));
  --hitl-s: color-mix(in srgb, var(--hitl) 12%, var(--surface));
  --warn-s: color-mix(in srgb, var(--warn) 12%, var(--surface));
  --u: .68;
  --fs: max(11px, calc(15px * var(--u))); --track: rgba(255,255,255,.09);
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6f5; --elev: #ffffff; --surface: #ffffff; --text: #121514; --muted: #5f6866; --subtle: #9aa29f;
  --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.16); --bubble: #eceeed;
  --jev: #0f8f7b; --llm: #6a56c4; --det: #55636f; --sec: #bf433d; --ok: #2f8a58; --hitl: #a8741c; --warn: #a8741c;
  --on-brand: #ffffff; --on-k: #ffffff;
  --edge: #d3d6d4; --arrow: #bcc1be; --grid: rgba(0,0,0,.06); --blob: .7;
  --jev-s: color-mix(in srgb, var(--jev) 9%, var(--surface));
  --det-s: color-mix(in srgb, var(--det) 8%, var(--surface));
  --llm-s: color-mix(in srgb, var(--llm) 9%, var(--surface));
  --sec-s: color-mix(in srgb, var(--sec) 8%, var(--surface));
  --ok-s: color-mix(in srgb, var(--ok) 8%, var(--surface));
  --hitl-s: color-mix(in srgb, var(--hitl) 8%, var(--surface));
  --warn-s: color-mix(in srgb, var(--warn) 9%, var(--surface));
  --track: rgba(0,0,0,.09);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; text-size-adjust: 100%; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
:root[data-theme="light"] * { scrollbar-color: rgba(0,0,0,.28) transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: var(--fs)/1.5 var(--sans); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
body.dragging { user-select: none; cursor: col-resize; }
@property --pct { syntax: '<number>'; inherits: false; initial-value: 0; }
@keyframes rise { from { opacity: 0; translate: 0 calc(8px * var(--u)); } to { opacity: 1; translate: 0 0; } }
@keyframes spin { to { rotate: 360deg; } }
@keyframes bounce { 0%, 80%, 100% { translate: 0 0; opacity: .35; } 40% { translate: 0 calc(-4px * var(--u)); opacity: 1; } }
:focus-visible { outline: 2px solid var(--jev); outline-offset: 2px; }

/* header */
header { display: flex; align-items: center; gap: calc(14px * var(--u)); padding: calc(8px * var(--u)) calc(18px * var(--u)); background: var(--elev); border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
.brand { display: flex; align-items: center; gap: calc(12px * var(--u)); color: inherit; text-decoration: none; }
.brand .mark { width: calc(32px * var(--u)); height: calc(32px * var(--u)); flex: none; color: var(--text); overflow: visible; }
.brand b { display: block; font: 700 max(10px, calc(17px * var(--u)))/1.2 var(--sans); letter-spacing: -.02em; }
.brand small { color: var(--jev); font: max(10px, calc(12px * var(--u))) var(--mono); letter-spacing: .02em; }
.tagline { flex: 0 1 calc(430px * var(--u)); min-width: 0; padding-left: calc(16px * var(--u)); border-left: 1px solid var(--line); font-size: max(10px, calc(12px * var(--u))); line-height: 1.4; color: var(--muted); }
.tagline b { color: var(--text); font-weight: 600; }
.metrics { margin-left: auto; display: flex; flex: 0 1 auto; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: calc(12px * var(--u)); overflow: hidden; }
.metric small { grid-area: n; font-size: max(10px, calc(11.5px * var(--u))); line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "l l" "v n"; column-gap: calc(9px * var(--u)); align-items: baseline; padding: calc(5px * var(--u)) calc(15px * var(--u)); min-width: 0; border-left: 1px solid var(--line); }
.metric:first-child { border-left: 0; }
.m-l { grid-area: l; white-space: nowrap; font: 400 max(10px, calc(10px * var(--u))) var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.m-l .mk { vertical-align: -2px; margin-right: calc(5px * var(--u)); }
.m-l .mk.jev { vertical-align: calc(-3px * var(--u)); width: calc(15px * var(--u)); height: calc(15px * var(--u)); border-radius: calc(4px * var(--u)); }
.metric output { grid-area: v; font-size: max(10px, calc(14.5px * var(--u))); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--subtle); white-space: nowrap; }
.metric output.hit { color: var(--text); animation: rise .3s ease-out; }
.metric output.split { flex-direction: column; align-items: flex-start; justify-content: center; gap: calc(3px * var(--u)); }
.mbar { display: flex; gap: 1px; width: calc(132px * var(--u)); height: calc(7px * var(--u)); border-radius: calc(4px * var(--u)); overflow: hidden; background: var(--bubble); }
.mbar i { min-width: calc(3px * var(--u)); }
.gverdict { display: flex; align-items: center; gap: calc(10px * var(--u)); flex-wrap: wrap; }
.gverdict small { color: var(--muted); font-size: max(10px, calc(12px * var(--u))); }
.mtxt { font-size: max(10px, calc(11px * var(--u))); font-weight: 500; color: var(--muted); white-space: nowrap; }
.b { padding: 0 calc(10px * var(--u)); border-radius: calc(99px * var(--u)); font-size: max(10px, calc(12.5px * var(--u))); font-weight: 600; border: 1px solid; }
.b.good { background: var(--ok-s); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 28%, var(--surface)); }
.b.bad { background: var(--sec-s); color: var(--sec); border-color: color-mix(in srgb, var(--sec) 28%, var(--surface)); }
.b.blue { background: var(--det-s); color: var(--det); border-color: color-mix(in srgb, var(--det) 28%, var(--surface)); }
.b.warn { background: var(--warn-s); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 28%, var(--surface)); }
.b.mono { font-family: var(--mono); font-size: max(10px, calc(12px * var(--u))); text-transform: none; background: var(--bubble); color: var(--text); border-color: var(--line); }

/* theme toggle */
#ah path { fill: var(--arrow); } #ah-on path { fill: var(--jev); }
body, header, .graph-pane, .chat, .surface, .bub, .row, .metrics, .chip { transition: background-color .45s, border-color .45s, color .45s; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; } ::view-transition-new(root) { z-index: 2; }
::view-transition-group(theme-toggle) { animation: none; }
::view-transition-old(theme-toggle) { display: none; }
::view-transition-new(theme-toggle) { animation: none; }

/* layout */
main { display: grid; grid-template-columns: var(--gw, min(52%, calc(820px * var(--u)))) calc(10px * var(--u)) 1fr; min-height: 0; }
.graph-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
.graph-wrap {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  background-image: radial-gradient(circle, var(--grid) 1px, transparent 1px); background-size: calc(20px * var(--u)) calc(20px * var(--u));
}
.graph-wrap::before, .graph-wrap::after { content: ""; position: absolute; width: 55%; aspect-ratio: 1; border-radius: 50%; filter: blur(calc(80px * var(--u))); pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.graph-wrap::before { background: var(--jev); top: -18%; left: -15%; opacity: calc(.13 * var(--blob)); }
.graph-wrap::after { background: var(--llm); bottom: -22%; right: -18%; opacity: calc(.11 * var(--blob)); animation-delay: -9s; }
@keyframes drift { to { translate: 9% 7%; } }
.graph-scroll { position: absolute; inset: 0; z-index: 1; display: flex; overflow: auto; padding: calc(8px * var(--u)); }
#wf { flex: none; margin: auto; overflow: visible; touch-action: none; }
.split { position: relative; cursor: col-resize; background: var(--bg); border-inline: 1px solid var(--line); outline-offset: -2px; }
.split::after { content: ""; position: absolute; left: 50%; top: 50%; width: calc(4px * var(--u)); height: calc(40px * var(--u)); translate: -50% -50%; border-radius: calc(4px * var(--u)); background: var(--subtle); opacity: .6; transition: background .15s, height .15s, opacity .15s; }
.split:hover::after, body.dragging .split::after { background: var(--jev); height: calc(64px * var(--u)); opacity: 1; }

/* identity */
.idsw { position: relative; flex: none; }
.id-btn { display: flex; align-items: center; gap: calc(9px * var(--u)); height: calc(40px * var(--u)); padding: 0 calc(11px * var(--u)) 0 calc(6px * var(--u)); border: 1px solid var(--line-strong); border-radius: calc(12px * var(--u)); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
.id-btn:hover, .id-btn[aria-expanded="true"] { border-color: var(--jev); background: var(--jev-s); }
.id-av { flex: none; width: calc(28px * var(--u)); height: calc(28px * var(--u)); border-radius: calc(8px * var(--u)); display: grid; place-items: center; font: 700 max(10px, calc(13px * var(--u))) var(--sans); background: var(--jev); color: var(--on-brand); }
.id-t { display: grid; text-align: left; line-height: 1.15; }
.id-t b { font-size: max(10px, calc(13px * var(--u))); }
.id-t small { font: max(10px, calc(11px * var(--u))) var(--mono); color: var(--muted); white-space: nowrap; }
.id-btn svg { width: calc(14px * var(--u)); height: calc(14px * var(--u)); stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.id-menu { position: absolute; right: 0; top: calc(100% + calc(8px * var(--u))); z-index: 30; width: calc(330px * var(--u)); max-width: calc(100vw - calc(20px * var(--u))); padding: calc(6px * var(--u)); background: var(--elev); border: 1px solid var(--line-strong); border-radius: calc(14px * var(--u)); box-shadow: 0 calc(24px * var(--u)) calc(48px * var(--u)) calc(-20px * var(--u)) rgba(0,0,0,.75); animation: rise .18s ease-out; }
.id-item { display: grid; grid-template-columns: calc(32px * var(--u)) minmax(0, 1fr); gap: calc(10px * var(--u)); width: 100%; padding: calc(9px * var(--u)) calc(10px * var(--u)); border: 0; border-radius: calc(10px * var(--u)); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.id-item:hover, .id-item[aria-checked="true"] { background: var(--jev-s); }
.id-item .id-av { width: calc(32px * var(--u)); height: calc(32px * var(--u)); }
.id-item b { font-size: max(10px, calc(13.5px * var(--u))); }
.id-item small { display: block; color: var(--muted); font-size: max(10px, calc(12px * var(--u))); }
.tl { display: flex; flex-wrap: wrap; gap: calc(4px * var(--u)); margin-top: calc(6px * var(--u)); }
.tl i { font: max(10px, calc(11px * var(--u))) var(--mono); font-style: normal; padding: 1px calc(7px * var(--u)); border-radius: calc(6px * var(--u)); border: 1px solid var(--line); background: var(--bg); }
.tl i em { font-style: normal; color: var(--subtle); }
.id-foot { display: flex; justify-content: space-between; align-items: center; gap: calc(10px * var(--u)); margin-top: calc(4px * var(--u)); padding: calc(8px * var(--u)) calc(10px * var(--u)) calc(4px * var(--u)); border-top: 1px solid var(--line); font-size: max(10px, calc(11.5px * var(--u))); color: var(--muted); }
.id-foot button { flex: none; font: inherit; font-size: max(10px, calc(12px * var(--u))); color: var(--jev); background: none; border: 0; cursor: pointer; padding: 2px calc(4px * var(--u)); }

/* model plan and activity */
.plan { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6px * var(--u)); padding: calc(9px * var(--u)) calc(12px * var(--u)); }
.chipx { font: max(10px, calc(11.5px * var(--u))) var(--mono); padding: 1px calc(9px * var(--u)); border-radius: calc(99px * var(--u)); border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.chipx.model { border-color: color-mix(in srgb, var(--llm) 50%, transparent); background: var(--llm-s); color: var(--llm); }
.chipx.no { color: var(--subtle); text-decoration: line-through; }
.act-row { display: grid; grid-template-columns: calc(12px * var(--u)) minmax(0, 1fr) auto; gap: calc(9px * var(--u)); align-items: baseline; padding: calc(6px * var(--u)) calc(12px * var(--u)); border-top: 1px solid var(--line); font-size: max(10px, calc(12.5px * var(--u))); }
.act-dot { width: calc(7px * var(--u)); height: calc(7px * var(--u)); border-radius: 50%; background: var(--ok); }
.act-row.err .act-dot { background: var(--sec); }
.act-row.skill .act-dot { background: var(--llm); }
.act-row.run .act-dot { background: var(--warn); animation: bounce 1s infinite; }
.act-row code { font: max(10px, calc(12px * var(--u))) var(--mono); color: var(--text); }
.act-row .ms { font: max(10px, calc(11px * var(--u))) var(--mono); color: var(--muted); }
.act-row .sum { color: var(--muted); }

/* raw Jev response */
.jraw summary small { margin-left: calc(8px * var(--u)); font: max(10px, calc(11px * var(--u))) var(--mono); color: var(--subtle); }
.jbar { display: flex; flex-wrap: wrap; gap: calc(6px * var(--u)); padding: 0 calc(12px * var(--u)) calc(8px * var(--u)); }
.jbar button { font: max(10px, calc(11px * var(--u))) var(--mono); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: calc(6px * var(--u)); padding: 2px calc(9px * var(--u)); cursor: pointer; }
.jbar button:hover { color: var(--jev); border-color: var(--jev); }
.jlabel { padding: 0 calc(12px * var(--u)) calc(4px * var(--u)); font: 400 max(10px, calc(10px * var(--u))) var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.jcode { margin: 0 calc(12px * var(--u)) calc(10px * var(--u)); padding: calc(10px * var(--u)) calc(12px * var(--u)); max-height: calc(300px * var(--u)); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: calc(8px * var(--u)); font: max(10px, calc(11.5px * var(--u)))/1.55 var(--mono); color: var(--muted); white-space: pre; tab-size: 2; }
.jk { color: var(--text); } .js { color: var(--jev); } .jn { color: var(--warn); } .jl { color: var(--llm); }
.jreq > summary { padding: calc(4px * var(--u)) calc(12px * var(--u)) calc(8px * var(--u)); font-size: max(10px, calc(12px * var(--u))); }
.chipx em { font-style: normal; color: var(--muted); margin-left: calc(6px * var(--u)); }

/* zoom */
.zoom { position: absolute; right: calc(22px * var(--u)); bottom: calc(22px * var(--u)); z-index: 3; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: calc(12px * var(--u)); box-shadow: 0 calc(8px * var(--u)) calc(24px * var(--u)) calc(-14px * var(--u)) rgba(0,0,0,.45); overflow: hidden; }
.zoom button { font: inherit; border: 0; background: transparent; color: var(--muted); height: calc(34px * var(--u)); min-width: calc(34px * var(--u)); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
.zoom button:hover { background: var(--jev-s); color: var(--jev); }
.zoom button:disabled { opacity: .35; cursor: default; background: transparent; color: var(--muted); }
.zoom svg { width: calc(16px * var(--u)); height: calc(16px * var(--u)); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.zoom .pct { min-width: calc(58px * var(--u)); padding: 0 calc(6px * var(--u)); font: 600 max(10px, calc(12.5px * var(--u))) var(--mono); font-variant-numeric: tabular-nums; color: var(--text); border-inline: 1px solid var(--line); }

/* graph */
@keyframes marchb { to { stroke-dashoffset: -32; } }
@keyframes halo { from { opacity: .55; stroke-width: 2; } to { opacity: 0; stroke-width: 16; } }
@keyframes pop { 0% { scale: .2; } 70% { scale: 1.25; } 100% { scale: 1; } }
.base { fill: none; stroke: var(--edge); stroke-width: 2; stroke-linejoin: round; marker-end: url(#ah); }
.s2e .base { stroke-dasharray: 4 5; opacity: .5; }
.e-on { fill: none; stroke: var(--jev); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.e-on.on { opacity: 1; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--jev) 35%, transparent)); }
.e-on.on.done { opacity: .62; filter: none; }
.dot { fill: var(--jev); filter: drop-shadow(0 0 4px var(--jev)); }
.dot.tail { opacity: .45; }
.elabel rect { fill: var(--surface); stroke: var(--line); transition: all .3s; }
.elabel text { font: 600 11.5px var(--mono); fill: var(--subtle); transition: fill .3s; }
.elabel.on rect { fill: var(--jev-s); stroke: var(--jev); }
.elabel.on text { fill: var(--jev); }
.node { cursor: grab; transform-box: fill-box; transform-origin: center; transition: transform .4s cubic-bezier(.34,1.4,.64,1), filter .3s; }
.node.drag { cursor: grabbing; }
.node.det { --k: var(--det); --k-s: var(--det-s); } .node.jev { --k: var(--jev); --k-s: var(--jev-s); }
.node.llm { --k: var(--llm); --k-s: var(--llm-s); } .node.sec { --k: var(--sec); --k-s: var(--sec-s); }
.node.hitl { --k: var(--hitl); --k-s: var(--hitl-s); }
.node .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.3; transition: stroke .3s, fill .3s; }
.node .halo { fill: none; stroke: var(--k); opacity: 0; pointer-events: none; }
.node .live { fill: none; stroke: var(--k); stroke-width: 2.2; stroke-dasharray: 9 7; opacity: 0; pointer-events: none; }
.node .tile { fill: var(--k-s); }
.node .ico { fill: none; stroke: var(--k); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.node .kind { font: 600 10.5px var(--mono); letter-spacing: .06em; fill: var(--k); }
.node .name { font: 650 16px var(--sans); fill: var(--text); }
.node .name.sm { font-size: 14px; }
.node .read { font: 12px var(--mono); fill: var(--muted); transition: fill .3s; }
.node .read.set { fill: var(--text); font-weight: 600; }
.node .think { opacity: 0; transition: opacity .2s; }
.node .think circle { fill: var(--k); }
.node[data-mode="deep"][data-st="active"] .think { opacity: 1; }
.node[data-mode="deep"][data-st="active"] .think circle { animation: tbounce 1.1s infinite; }
.node[data-mode="deep"][data-st="active"] .think circle:nth-child(2) { animation-delay: .18s; }
.node[data-mode="deep"][data-st="active"] .think circle:nth-child(3) { animation-delay: .36s; }
@keyframes tbounce { 0%, 80%, 100% { translate: 0 0; opacity: .35; } 40% { translate: 0 -4px; opacity: 1; } }
.node[data-mode="fast"][data-st="active"] .halo { animation: halo .5s ease-out infinite; }
.node[data-mode="fast"][data-st="active"] .live { animation-duration: .35s; }
.node[data-mode="deep"][data-st="active"] .halo { animation: halo 2.2s ease-in-out infinite; }

    + yesNo('Is the requester verified?', sc.requester_verified, { lo: lim.verified_below, yes: 'good', no: 'warn' })
    + yesNo('Does it look like social engineering?', sc.matches_attack_pattern, { lo: lim.risk_at, hi: lim.deny_at, yes: 'bad', no: 'good', mid: 'Unsure' });
  const fact = (k, v, tip) => `<span class="fact" title="${esc(tip)}"><span class="fk">${k}</span><span class="fv">${v}</span></span>`;
  const facts = fact('Reversible', known.reversible ? 'Yes' : 'No', 'Known from the tool, not judged by Jev') + fact('Touches production', known.production ? 'Yes' : 'No', 'Known from the tool, not judged by Jev');
  const out = { auto: ['good', 'Runs'], approve: ['warn', 'Needs approval'], deny: ['bad', 'Refused'] }[ev.outcome];
  (turn.apvEv ||= {})[ev.id] = ev;
  const ask = ev.outcome === 'approve' ? `<div class="apv-row" data-id="${esc(ev.id)}">${waitingRow(ev)}</div>` : '';
  return head('shield', 'var(--hitl)', 'Safety check', `Before ${esc(ev.tool)} runs \u00b7 System 1`, '')
    + `<div class="sf-bd"><div class="apv-act"><span class="gl">Proposed action</span>${esc(ev.action)}</div><div class="facts">${facts}</div><div class="checks">${checks}</div>`
    + `<div class="gverdict"><span class="gl">Decision</span><span class="b ${out[0]}">${out[1]}</span><small>${esc(ev.rule)}.</small></div>${ask}</div>` + jsonToggle(ev.raw);
}
const firstName = l => String(l).split(' ')[0];
const profileLabel = id => (profiles.find(p => p.id === id) || { label: id }).label;
function waitingRow(ev, note) {
  const aps = ev.approvers || [], req = ev.requester || { label: 'you' };
  if (!aps.length) return '<span class="apv-note">Nobody else can approve this action, so it is declined.</span>';
  return `<span class="apv-who">Waiting for ${aps.map(a => `<b>${esc(a.label)}</b><small>${esc(a.title)}</small>`).join(' or ')}</span>`
    + aps.map(a => `<button type="button" class="apv-btn yes" data-act="switch" data-as="${esc(a.id)}">Switch to ${esc(firstName(a.label))} to approve</button>`).join('')
    + `<span class="apv-note">${note ? esc(note) + ' ' : ''}You are signed in as ${esc(req.label)} and return to ${esc(firstName(req.label))} after the decision. No answer in ${ev.timeout} s counts as declined.</span>`;
}
function approvalDone(ev) {
  const el = turn.apv[ev.id], row = el && el.querySelector('.apv-row'); if (!row) return;
  const by = ev.by ? ev.by.label : 'a person';
  const w = { approved: ['good', 'Approved by ' + by], declined: ['bad', 'Declined by ' + by], timeout: ['bad', 'No answer in time, so declined'], unreachable: ['bad', 'No approver reachable, so declined'] }[ev.decision] || ['bad', ev.decision];
  row.innerHTML = `<span class="b ${w[0]}">${w[1]}</span><span class="apv-note">after ${fmt(ev.waited_ms)}</span>`;
}

/* ---------- run ---------- */
function finish() { restoreMe(); running = false; $('send').disabled = false; $('wf').classList.remove('running'); if (es) es.close(); es = null; }
async function runLive(text) {
  if (running) return;
  const my = ++runToken;
  running = true; $('send').disabled = true;
  resetGraph(); resetStats(); 
  turn = newTurn(text); t0 = Date.now(); tJev = 0; jevMs = 0;
  try {
    const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, profile: me }) });
    if (!res.ok) throw new Error('Start failed: ' + res.status);
    const { run_id } = await res.json();
    if (my !== runToken) return;
    turn.runId = run_id;
    es = new EventSource('/api/stream/' + run_id);
    es.onmessage = e => {
      if (my !== runToken) return;
      const ev = JSON.parse(e.data);
      if (ev.type === 'node_start') {
        turn.m.starts[ev.node] = ev.t || 0;
        activate(ev.node);
        if (ev.node !== 'n-intake') openStep(stepOf(ev.node));
        if (ev.node === 'n-handle') showPlan(false);
        if (ev.node === 'n-reply') showPlan(false);
      } else if (ev.type === 'node_done') {
        turn.m.ends[ev.node] = ev.t || 0; doneMs[ev.node] = ev.ms; setNode(ev.node, 'done'); setTiming(ev.node, ev.ms); stepTime(ev.node, ev.ms);
        renderBuckets();
      } else if (ev.type === 'usage') {
        trackUsage(ev);
        const u = usage[ev.bucket]; if (u) { u.calls += ev.calls || 0; u.cost += ev.cost_usd || 0; u.tokens += (ev.input_tokens || 0) + (ev.output_tokens || 0); if (ev.cost_usd == null) u.unpriced = true; if (ev.model) u.models.add(ev.model); renderBuckets(); }
      } else if (ev.type === 'guard') {
        const g = ev.data, top = Math.max(g.scores.prompt_injection, g.scores.jailbreak);
        surface(guardSurface(g, doneMs['n-guard']));
        if (turn.typing) turn.typing.remove();
        $(GUARD_LABEL[g.verdict])?.setAttribute('class', 'elabel on');
        setReadout('n-guard', g.verdict === 'decline' ? 'not an IT matter' : pct(top) + '% top risk');
      } else if (ev.type === 'understand') {
        const u = ev.data;
        surface(understandSurface(u));
        if (turn.typing) turn.typing.remove();
        $(UND_LABEL[u.path])?.setAttribute('class', 'elabel on');
        setReadout('n-understand', `${CAT[u.category.value]} \u00b7 ${IMPACT[u.impact].word}`);
        turn.plan = u.plan || null;
        if (u.path === 'reply' && u.plan) setReadout('n-reply', u.plan.model);
        if (u.path === 'specialist') setReadout('n-hold', 'security matter');
      } else if (ev.type === 'plan') {
        const p = ev.data; turn.plan = p;
        surface(planSurface(p));
        if (turn.typing) turn.typing.remove();
        setReadout('n-plan', p.model);
        setReadout('n-handle', p.model);
      } else if (ev.type === 'token') {
        streamText(ev.text);
      } else if (ev.type === 'ttft') {
        turn.m.ttft[ev.node] = { ms: ev.ms, at: ev.t || 0 };
        const chip = turn.tt[ev.node]; if (chip) { chip.textContent = 'first token ' + fmt(ev.ms); chip.hidden = false; }
      } else if (ev.type === 'answer_reset') {
        unstream();
      } else if (ev.type === 'safety') {
        const card = surface(safetySurface(ev)); turn.apv[ev.id] = card;
        const g0 = (turn.m.gate && turn.m.gate.from) || ev.t || 0, took = Math.max(1, (ev.t || 0) - g0);
        if (ev.outcome === 'approve') {
          turn.m.pend = { id: ev.id, from: ev.t || 0 };
          const aps = ev.approvers || []; gateHold(aps.length ? aps.map(a => firstName(a.label)).join(' or ') : 'no approver');
        } else gateClose(ev.outcome === 'auto' ? 'low risk, runs' : 'refused', took);
      } else if (ev.type === 'approval_result') {
        const p = turn.m.pend; turn.m.waits.push({ from: p ? p.from : (ev.t || 0) - ev.waited_ms, to: ev.t || 0, ms: ev.waited_ms });
        approvalDone(ev); restoreMe();
        const by = ev.by ? firstName(ev.by.label) : '';
        gateClose({ approved: 'approved by ' + by, declined: 'declined by ' + by, timeout: 'no answer, declined', unreachable: 'no approver' }[ev.decision] || ev.decision,
          Math.max(1, (ev.t || 0) - ((turn.m.gate && turn.m.gate.from) || 0)));
      } else if (ev.type === 'style') {
        addAct('skill', `Applied skill <code>${esc(ev.name)}</code> <span class="sum">format and tone, always on</span>`);
      } else if (ev.type === 'identity') {
        setReadout('n-intake', `${ev.label} \u00b7 ${ev.tools.length} tools`);
      } else if (ev.type === 'skill') {
        addAct('skill', `Loaded skill <code>${esc(ev.name)}</code>${ev.resource ? ' \u00b7 ' + esc(ev.resource) : ''}`);
      } else if (ev.type === 'tool_call') {
        turn.pending.push(addAct('run', `<code>${esc(ev.name)}</code>(${esc(argText(ev.args))})`));
        if (WRITE_TOOLS.includes(ev.name)) { turn.m.gate = { from: ev.t || 0 }; gateOpen(); }
        turn.m.pairs.push({ name: ev.name, from: ev.t || 0, to: null });
      } else if (ev.type === 'tool_result') {
        const pair = turn.m.pairs.find(x => x.name === ev.name && x.to == null); if (pair) pair.to = ev.t || 0;
        const row = turn.pending.shift() || addAct('', '');
        row.className = 'act-row ' + (ev.status === 'ok' ? '' : 'err');
        row.children[1].innerHTML = `<code>${esc(ev.name)}</code> <span class="sum">${esc(ev.summary)}</span>`;
        row.children[2].textContent = ev.ms != null ? fmt(ev.ms) : '';
      } else if (ev.type === 'triage') {
        const c = ev.data.raw_jev?.category;
        if (c) setReadout('n-jev-triage', `${CATEGORY[c.choice] || c.choice} ${pct(c.probabilities[c.choice])}%`);
        showTriage(ev.data);
        if (ev.data.tool_choice) stat('s-tool', ev.data.tool_choice, 'mono');
      } else if (ev.type === 'route') {
        route = ev.route;
        stat('s-route', ROUTES[ev.route]?.title || ev.route, ROUTES[ev.route]?.cls);
        $(ROUTE_LABEL[ev.route])?.setAttribute('class', 'elabel on');
        setReadout('n-policy', ev.route);
        showDecisions(ev.route);
      } else if (ev.type === 'complete') {
        if (prev) setNode(prev, 'done');
        stat('s-total', ((Date.now() - t0) / 1000).toFixed(1) + ' s');
        renderBuckets(true);
        showReply(ev.reply, false, turn.streamed);
        runSummary(ev.t || (Date.now() - t0));
        finish();
      } else if (ev.type === 'error') {
        showReply(ev.message, true); finish();
      }
    };
    es.onerror = () => { if (running) { showReply('Connection lost. Is the server running?', true); finish(); } };
  } catch (err) {
    showReply(err.message, true); finish();
  }
}

$('new-chat').addEventListener('click', () => newConversation());

function newConversation() {
  restoreMe();
  runToken++;
  if (es) { es.close(); es = null; }
  running = false; $('send').disabled = false;
  thread.innerHTML = ''; turn = null;
  resetGraph(); $('wf').classList.remove('running'); resetStats();
  $('input').value = ''; $('input').focus();
}

/* ---------- theme ---------- */
const themeBtn = $('theme');
const curTheme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function syncTheme() { const d = curTheme() === 'dark'; themeBtn.setAttribute('aria-checked', String(d)); themeBtn.title = d ? 'Switch to light mode' : 'Switch to dark mode'; }
function setTheme(next, x, y) {
  const apply = () => { document.documentElement.dataset.theme = next; syncTheme(); };
  if (!document.startViewTransition || reduced) { apply(); return; }
  const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration: 700, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
  )).catch(() => {});
}
themeBtn.addEventListener('click', () => {
  const b = themeBtn.getBoundingClientRect(), next = curTheme() === 'dark' ? 'light' : 'dark';
  store.set('theme', next); setTheme(next, b.left + b.width / 2, b.top + b.height / 2);
});

syncTheme();

/* ---------- identity ---------- */
const USER_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a4 4 0 100 8 4 4 0 000-8zM4.5 20.5c0-3.6 3.4-5.5 7.5-5.5s7.5 1.9 7.5 5.5"/></svg>';
let profiles = [], me = store.get('profile') || 'user_a';
const meInfo = () => profiles.find(p => p.id === me) || { label: me === 'user_b' ? 'Dan Kim' : 'Carol Wu', title: '', tools: [] };
let acting = null; // { home } while the page is signed in as an approver, to return to afterwards
function renderMe() {
  const m = meInfo(); $('id-label').textContent = m.label;
  $('id-title').textContent = acting ? 'Approving for ' + profileLabel(acting.home) : m.title;
  $('id-btn').classList.toggle('acting', !!acting);
}
function actAs(id) { if (!acting) acting = { home: me }; me = id; renderMe(); renderMenu(); }
function restoreMe() { if (!acting) return; me = acting.home; acting = null; renderMe(); renderMenu(); }
function renderMenu() {
  $('id-menu').innerHTML = profiles.map(p => `<button type="button" role="menuitemradio" class="id-item" data-id="${esc(p.id)}" aria-checked="${p.id === me}"><span class="id-av">${USER_ICON}</span><span><b>${esc(p.label)}</b><small>${esc(p.title)}</small><span class="tl">${p.tools.map(t => `<i>${esc(t.name)}${t.scope === 'self' ? ' <em>self</em>' : ''}</i>`).join('')}${(p.approves || []).map(t => `<i class="ap">approves ${esc(t)}</i>`).join('')}</span></span></button>`).join('')
    + '<div class="id-foot"><span>Sign-in stand-in. Each person gets different tools.</span><button type="button" id="id-reset">Reset demo data</button></div>';
}
async function loadProfiles() {
  try { const d = await (await fetch('/api/profiles')).json(); profiles = d.profiles || []; if (profiles.length && !profiles.some(p => p.id === me)) me = d.default; } catch {}
  renderMe(); renderMenu();
}
const idBtn = $('id-btn'), idMenu = $('id-menu');
const setMenu = open => { idMenu.hidden = !open; idBtn.setAttribute('aria-expanded', String(open)); };
idBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(idMenu.hidden); });
document.addEventListener('click', e => { if (!idMenu.hidden && !e.target.closest('#idsw')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
idMenu.addEventListener('click', async e => {
  const item = e.target.closest('.id-item');
  if (item) { acting = null; me = item.dataset.id; store.set('profile', me); renderMe(); renderMenu(); setMenu(false); newConversation(); return; }
  if (e.target.id === 'id-reset') {
    try { await fetch('/api/demo/reset', { method: 'POST' }); e.target.textContent = 'Data reset'; setTimeout(() => { e.target.textContent = 'Reset demo data'; }, 1600); } catch {}
  }
});
loadProfiles();

thread.addEventListener('click', e => {
  const b = e.target.closest('.jcopy'); if (!b) return;
  const pre = b.closest('.jraw').querySelector(`pre[data-j="${b.dataset.w}"]`);
  const done = () => { const t = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = t; }, 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(done).catch(() => {});
});

thread.addEventListener('click', e => {
  const b = e.target.closest('.apv-btn'); if (!b || !turn) return;
  const row = b.closest('.apv-row'), id = row.dataset.id, ev = (turn.apvEv || {})[id], act = b.dataset.act;
  if (act === 'switch') {
    actAs(b.dataset.as); row.dataset.as = b.dataset.as;
    row.innerHTML = `<span class="apv-who">Signed in as <b>${esc(profileLabel(b.dataset.as))}</b>, approving for ${esc(profileLabel(acting.home))}</span>`
      + '<button type="button" class="apv-btn yes" data-act="decide" data-a="1">Approve</button><button type="button" class="apv-btn" data-act="decide" data-a="0">Decline</button>'
      + `<button type="button" class="apv-btn ghost" data-act="back">Back to ${esc(firstName(profileLabel(acting.home)))}</button>`;
  } else if (act === 'back') {
    restoreMe(); row.innerHTML = ev ? waitingRow(ev) : '';
  } else if (act === 'decide') {
    const by = row.dataset.as, home = profileLabel(acting ? acting.home : me);
    row.querySelectorAll('button').forEach(x => { x.disabled = true; });
    restoreMe();
    row.innerHTML = `<span class="apv-note">Sent as ${esc(profileLabel(by))}. You are ${esc(home)} again.</span>`;
    fetch('/api/approve/' + turn.runId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, approve: b.dataset.a === '1', by }) })
      .then(r => { if (!r.ok && row.isConnected && ev && !row.querySelector('.b')) row.innerHTML = waitingRow(ev, r.status === 403 ? 'That person cannot approve this action.' : 'The approval could not be sent.'); })
      .catch(() => {});
  }
});

/* ---------- wiring ---------- */
$('chips').innerHTML = Object.keys(SCENARIOS).map(k => `<button type="button" class="chip">${k}</button>`).join('');
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; if (b.id === 'new-chat') newConversation(); else runLive(SCENARIOS[b.textContent]); });
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('input').value.trim();
  if (!v || running) return;
  $('input').value = ''; runLive(v);
});
</script>
</body>
